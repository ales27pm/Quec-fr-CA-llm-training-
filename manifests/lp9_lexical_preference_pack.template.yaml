    preferred_term: fin de semaine
    rejected_terms: [weekend, week-end]
    domain: time
  - source_term: chat
    preferred_term: clavardage
    rejected_terms: [chat]
    domain: digital
  - source_term: newsletter
    preferred_term: infolettre
    rejected_terms: [newsletter]
