kind: modern_corpus_acquisition_manifest
schema_version: "1.0"
primary_language: fr-CA
sources:
  - source_id: assnat_journal_debats_modern
    name: Assemblée nationale - Journal des débats (moderne)
    source_type: official_html
    acquisition_status: active
    license_status: noncommercial_only
    commercial_use: permission_required
    allowed_for_training: true
    allowed_for_evaluation: false
    holdout_only: false
    pii_risk: low
    min_text_chars: 80
    min_delay_seconds: 1.0
    registers:
      - parliamentary
      - spoken_formal
    domains:
      - politics
      - public_administration
      - law
    adapter:
      name: assnat_journal_debats
      seed_urls:
        - https://www.assnat.qc.ca/fr/travaux-parlementaires/journal-debats/

  - source_id: donnees_quebec_ckan_textual
    name: Données Québec CKAN metadata
    source_type: ckan_api
    acquisition_status: active
    license_status: open_compatible
    commercial_use: allowed_if_package_license_allows
    allowed_for_training: true
    allowed_for_evaluation: false
    holdout_only: false
    pii_risk: low
    min_text_chars: 120
    registers:
      - administrative
    domains:
      - public_administration
    adapter:
      name: donnees_quebec_ckan
      base_url: https://www.donneesquebec.ca/recherche/api/3/action
      query_terms:
        - francais
        - services
        - municipal
        - quebec
      rows: 100

  - source_id: banq_rights_cleared_local
    name: BAnQ rights-cleared local
    source_type: local_permissioned_dump
    acquisition_status: local_only
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    allowed_for_evaluation: false
    holdout_only: false
    pii_risk: low
    adapter:
      name: local_text_bundle
      local_globs:
        - data/permissioned/banq/**/*.txt

  - source_id: alloprof_permission_required
    name: Alloprof permission required
    source_type: permission_required
    acquisition_status: permission_required
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    allowed_for_evaluation: false
    holdout_only: false
    pii_risk: low
    adapter:
      name: permissioned_html_dump

  - source_id: oqlf_vitrine_reference_permission_required
