kind: modern_corpus_acquisition_manifest
schema_version: "1.0"
primary_language: fr-CA
sources:
  - source_id: assnat_journal_debats_modern
    name: Assemblée nationale - Journal des débats (moderne)
    source_type: official_html
    acquisition_status: active
    license_status: noncommercial_only
    commercial_use: permission_required
    allowed_for_training: true
    adapter: {name: assnat_journal_debats, seed_urls: ["https://www.assnat.qc.ca/fr/travaux-parlementaires/journal-debats/"]}
  - source_id: donnees_quebec_ckan_textual
    name: Données Québec CKAN text metadata
    source_type: ckan_api
    acquisition_status: active
    license_status: open_compatible
    commercial_use: allowed
    allowed_for_training: true
    adapter: {name: donnees_quebec_ckan, base_url: "https://www.donneesquebec.ca/recherche/api/3/action", query: "texte OR description"}
  - source_id: banq_rights_cleared_local
    name: BAnQ rights-cleared local
    source_type: local_permissioned_dump
    acquisition_status: local_only
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    adapter: {name: local_text_bundle, local_globs: ["data/permissioned/banq/**/*.txt"]}
  - source_id: alloprof_permission_required
    name: Alloprof permission required
    source_type: permission_required
    acquisition_status: permission_required
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    adapter: {name: permissioned_html_dump}
  - source_id: oqlf_vitrine_reference_permission_required
    name: OQLF permission required
    source_type: permission_required
    acquisition_status: permission_required
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    adapter: {name: permissioned_html_dump}
  - source_id: fdlq_access_request
    name: FDLQ access request
    source_type: permission_required
    acquisition_status: permission_required
    license_status: permission_required
    commercial_use: permission_required
    allowed_for_training: false
    adapter: {name: restricted_corpus_request}
  - source_id: quebec_insurance_rag_corpora
    name: Quebec insurance RAG corpora
    source_type: github_dataset
    acquisition_status: catalog_only
    license_status: unclear
    commercial_use: unknown
    allowed_for_training: false
    adapter: {name: github_json_or_text_dataset}
  - source_id: qfrcola_holdout
    name: QFrCoLA holdout
    source_type: evaluation_holdout
    acquisition_status: holdout_only
    license_status: holdout_only
    commercial_use: prohibited
    allowed_for_training: false
    adapter: {name: holdout_registry}
  - source_id: qfrblimp_holdout
    name: QFrBLiMP holdout
    source_type: evaluation_holdout
    acquisition_status: holdout_only
    license_status: holdout_only
    commercial_use: prohibited
    allowed_for_training: false
    adapter: {name: holdout_registry}
  - source_id: qfrcore_qfrcort_holdout
    name: QFrCoRE/QFrCoRT holdout
    source_type: evaluation_holdout
    acquisition_status: holdout_only
    license_status: holdout_only
    commercial_use: prohibited
    allowed_for_training: false
    adapter: {name: holdout_registry}
  - source_id: cole_holdout
    name: COLE holdout
    source_type: evaluation_holdout
    acquisition_status: holdout_only
    license_status: holdout_only
    commercial_use: prohibited
    allowed_for_training: false
    adapter: {name: holdout_registry}
