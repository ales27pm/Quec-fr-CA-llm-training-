kind: error_taxonomy_manifest
schema_version: "1.0"
lp_id: 20
phenomenon: orphaned_preposition
taxonomy:
  - error_code: orphaned_preposition_attachment_error
    label: Attachment error
    severity: blocking
    description: Preposition retained but attached to wrong constituent.
    detection_guidance: Trace dependency/attachment of stranded preposition.
    remediation_guidance: Enforce clause-level attachment constraints.
    examples: ["à attached to wrong relative clause"]
    applies_to: ["LP20", "orphaned_preposition"]
  - error_code: preposition_omission
    label: Omitted preposition
    severity: blocking
    description: Required preposition is dropped.
    detection_guidance: Check required preposition token presence.
    remediation_guidance: Add hard constraint for required preposition retention.
    examples: ["de omitted in relative clause"]
    applies_to: ["LP20"]
  - error_code: relative_clause_attachment_error
    label: Relative clause attachment drift
    severity: non_blocking
    description: Relative clause attaches ambiguously and degrades clarity.
    detection_guidance: Inspect relative pronoun target attachment.
    remediation_guidance: Prefer structurally unambiguous variants.
    examples: ["que-clause attached to unintended noun"]
    applies_to: ["LP20"]
  - error_code: interrogative_preposition_loss
    label: Interrogative preposition loss
    severity: blocking
    description: Interrogative form loses governing preposition.
    detection_guidance: Verify interrogative pattern retains governing preposition.
    remediation_guidance: Add interrogative-specific post-edit checks.
    examples: ["À qui -> Qui"]
    applies_to: ["LP20"]
  - error_code: rare_syntax_generalization_error
    label: Over-generalized rare syntax
    severity: non_blocking
    description: Model over-generalizes rare orphaned-preposition pattern.
    detection_guidance: Compare against context-bound allowed templates.
    remediation_guidance: Balance pattern frequency in finetuning mixture.
    examples: ["rare orphaned form applied in neutral context"]
    applies_to: ["LP20", "syntax"]
