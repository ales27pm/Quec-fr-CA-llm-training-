name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: python -m pytest
      - run: python3 tools/update_agents.py --validate
      - run: qfr validate
      - run: qfr validate-modern-corpus --manifest manifests/modern_corpus_acquisition_manifest.template.yaml
      - run: qfr validate-modern-corpus --manifest manifests/modern_corpus_acquisition.donnees_quebec.template.yaml
      - run: qfr validate-modern-corpus --manifest manifests/modern_corpus_acquisition.assnat_seed.template.yaml
      - run: qfr acquire-modern-corpus --manifest manifests/modern_corpus_acquisition_manifest.template.yaml --out reports/modern_corpus/harvest.jsonl --report reports/modern_corpus/dry_run_report.json --max-documents 0
      - run: qfr acquire-modern-corpus --manifest manifests/modern_corpus_acquisition.donnees_quebec.template.yaml --out reports/modern_corpus/donnees_quebec_fixture_harvest.jsonl --report reports/modern_corpus/donnees_quebec_fixture_report.json --max-documents 25
      - run: qfr acquire-modern-corpus --manifest manifests/modern_corpus_acquisition.assnat_seed.template.yaml --out reports/modern_corpus/assnat_fixture_harvest.jsonl --report reports/modern_corpus/assnat_fixture_report.json --include-noncommercial --max-documents 10
      - run: qfr audit-corpus-readiness --input reports/modern_corpus/donnees_quebec_fixture_harvest.jsonl --out reports/corpus_readiness/modern_fixture_report.json
      - run: qfr validate-corpus-sources --manifest manifests/corpus_source_manifest.template.yaml
      - run: qfr ingest-corpus-sources --manifest manifests/corpus_source_manifest.template.yaml --out reports/corpus_ingestion/harvest.jsonl --report reports/corpus_ingestion/report.json --min-chars 20
      - run: qfr validate-curation-policy --policy manifests/curation_policy_manifest.template.yaml
      - run: qfr curate-corpus --input reports/corpus_ingestion/harvest.jsonl --policy manifests/curation_policy_manifest.template.yaml --out-dir reports/corpus_curation
      - run: qfr validate-split-policy --policy manifests/split_policy_manifest.template.yaml
      - run: qfr split-curated-corpus --input reports/corpus_curation/accepted.jsonl --policy manifests/split_policy_manifest.template.yaml --out-dir reports/curated_splits
      - run: qfr validate-training-export --manifest manifests/training_export_manifest.template.yaml
      - run: qfr export-training-dataset --manifest manifests/training_export_manifest.template.yaml --out-dir reports/training_export
      - run: qfr validate-taxonomy --taxonomy eval/lp9_error_taxonomy.yaml
      - run: qfr validate-taxonomy --taxonomy eval/lp20_error_taxonomy.yaml
      - run: qfr diagnose-eval --input fixtures/diagnostics/lp9_lp20_eval_sample.jsonl --taxonomy eval/lp9_error_taxonomy.yaml --taxonomy eval/lp20_error_taxonomy.yaml --out-json reports/diagnostics.lp9_lp20.json --out-md reports/diagnostics.lp9_lp20.md
      # These run sequentially and intentionally target the same output file; the second overwrites the first to verify
      # both execution paths produce equivalent output (guarded by tests and deterministic artifact checks).
      - run: python tools/pipeline_ops.py diagnose-semantic --in-csv fixtures/diagnostics/lp9_lp20_legacy_semantic.csv --out-json reports/diagnostics.legacy_semantic.json
      - run: qfr diagnose-legacy-csv --in-csv fixtures/diagnostics/lp9_lp20_legacy_semantic.csv --out-json reports/diagnostics.legacy_semantic.json
      - run: qfr generate-minimal-pairs --rule rules/lp_rule_manifest.template.yaml --context rules/lp9_lexical_semantics.contexts.yaml --out data/generated/minimal_pairs.lp9.jsonl --report reports/minimal_pair_quality.lp9.json
      - run: qfr validate-minimal-pairs --input data/generated/minimal_pairs.lp9.jsonl --context rules/lp9_lexical_semantics.contexts.yaml --report reports/minimal_pair_quality.lp9.json
      - run: qfr generate-minimal-pairs --rule rules/lp_rule_manifest.template.yaml --context rules/lp20_orphaned_preposition.contexts.yaml --out data/generated/minimal_pairs.lp20.jsonl --report reports/minimal_pair_quality.lp20.json
      - run: qfr validate-minimal-pairs --input data/generated/minimal_pairs.lp20.jsonl --context rules/lp20_orphaned_preposition.contexts.yaml --report reports/minimal_pair_quality.lp20.json
      - run: qfr release-report --metrics fixtures/valid_metrics.json --diagnostics reports/diagnostics.lp9_lp20.json --out-json reports/release_report.json --out-md reports/release_report.md
      - run: qfr release-candidate --metrics fixtures/valid_metrics.json --diagnostics-input fixtures/diagnostics/lp9_lp20_eval_sample.jsonl --out-json reports/release_candidate.json --out-md reports/release_candidate.md

      - run: python tools/pipeline_ops.py harvest --inputs fixtures/data_pipeline/raw_sample_1.txt fixtures/data_pipeline/raw_sample_2.txt --out reports/data_pipeline_demo/harvest.jsonl --min-chars 20
      - run: qfr curate --in reports/data_pipeline_demo/harvest.jsonl --out reports/data_pipeline_demo/curated.jsonl --min-fr-ca-score 0.05
      - run: qfr edit-normative --in reports/data_pipeline_demo/curated.jsonl --out reports/data_pipeline_demo/edited.jsonl
      - run: qfr split --in reports/data_pipeline_demo/edited.jsonl --out-dir reports/data_pipeline_demo/splits --seed 42
      - run: qfr training-recipe --data-dir reports/data_pipeline_demo/splits --out reports/data_pipeline_demo/training_recipe.yaml
      - run: qfr monitor-lp7 --pre 0.95 --post 0.94 --release-gates project/release_gates.yaml --out reports/data_pipeline_demo/lp7_monitor.json
      - run: git diff --exit-code -- data/generated/minimal_pairs.lp9.jsonl reports/minimal_pair_quality.lp9.json data/generated/minimal_pairs.lp20.jsonl reports/minimal_pair_quality.lp20.json reports/diagnostics.lp9_lp20.json reports/diagnostics.lp9_lp20.md reports/diagnostics.legacy_semantic.json reports/release_report.json reports/release_report.md reports/release_candidate.json reports/release_candidate.md reports/data_pipeline_demo/harvest.jsonl reports/data_pipeline_demo/curated.jsonl reports/data_pipeline_demo/edited.jsonl reports/data_pipeline_demo/splits/train.jsonl reports/data_pipeline_demo/splits/dev.jsonl reports/data_pipeline_demo/splits/test.jsonl reports/data_pipeline_demo/training_recipe.yaml reports/data_pipeline_demo/lp7_monitor.json reports/corpus_ingestion/harvest.jsonl reports/corpus_ingestion/report.json reports/corpus_curation/accepted.jsonl reports/corpus_curation/review_required.jsonl reports/corpus_curation/quarantine.jsonl reports/corpus_curation/rejected.jsonl reports/corpus_curation/report.json reports/curated_splits/train.jsonl reports/curated_splits/dev.jsonl reports/curated_splits/test.jsonl reports/curated_splits/split_report.json reports/training_export/training_manifest.json reports/training_export/training_manifest.yaml reports/training_export/dataset_card.md reports/training_export/export_report.json reports/modern_corpus/harvest.jsonl reports/modern_corpus/dry_run_report.json reports/modern_corpus/donnees_quebec_fixture_harvest.jsonl reports/modern_corpus/donnees_quebec_fixture_report.json reports/modern_corpus/assnat_fixture_harvest.jsonl reports/modern_corpus/assnat_fixture_report.json reports/corpus_readiness/modern_fixture_report.json
